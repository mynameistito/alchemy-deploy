name: Alchemy deployment
description: Deploy, report, and clean up Alchemy Cloudflare Workers
inputs:
  worker-name:
    description: Base Cloudflare Worker name
    required: true
  deploy-command:
    description: Trusted production deploy command; PR previews use the action's pinned Alchemy runtime and CI artifact
    required: true
  destroy-command:
    description: Legacy input retained for compatibility; first-class Preview cleanup uses the action's trusted Alchemy stack
    required: true
  production-url:
    description: Canonical HTTPS production URL
    required: true
  production-stage:
    description: Alchemy stage reserved for production
    default: prod
    required: false
  use-adopt:
    description: Append --adopt to the configured deploy command
    default: false
    required: false
  allow-fork-commits:
    description: Allow explicitly approved fork commits for preview deployments
    default: false
    required: false
  worker-config:
    description: Optional JSON public environment values for the trusted Worker Preview stack
    default: ""
    required: false
  worker-secrets:
    description: Optional JSON object of preview-only secret string values
    default: ""
    required: false
  worker-do-bindings:
    description: Trusted JSON map of local Preview Durable Object bindings to className
    default: ""
    required: false
  worker-rate-limit-bindings:
    description: Optional trusted JSON rate-limit bindings for Worker Previews
    default: ""
    required: false
  worker-state-bindings:
    description: Optional JSON references to preprovisioned preview resources
    default: ""
    required: false
  preview-state-url:
    description: Optional HTTPS root URL of a preprovisioned preview state backend
    default: ""
    required: false
  preview-state-expected-origin:
    description: Expected HTTPS origin of the preview state backend
    default: ""
    required: false
  preview-state-token:
    description: Bearer token for the preview state backend
    default: ""
    required: false
  preview-artifact:
    description: Name of the credential-free CI artifact containing the built Worker bundle
    default: alchemy-worker
    required: false
  preview-entrypoint:
    description: Entrypoint path inside the Worker artifact, relative to the artifact root
    default: index.js
    required: false
  preview-assets-directory:
    description: Optional static assets directory inside the Worker artifact, relative to the artifact root
    default: ""
    required: false
  preview-assets-config:
    description: JSON configuration for the Worker static assets, excluding the artifact directory
    default: "{}"
    required: false
  preview-compatibility-date:
    description: Compatibility date for the preview Worker; set to the production Worker date
    default: ""
    required: false
  preview-compatibility-flags:
    description: JSON array of compatibility flags for the preview Worker
    default: "[]"
    required: false
  preview-url-pattern:
    description: URL glob containing {worker}, {stage}, and optionally *; Worker Preview URLs use stage-worker ordering
    default: https://{stage}-{worker}.*.workers.dev
    required: false
  ci-workflow:
    description: CI workflow file used for exact-SHA gating
    default: ci.yml
    required: false
  production-branch:
    description: Branch allowed to deploy production
    default: main
    required: false
  pull-request-number:
    description: Resolved pull request number for workflow_run events
    default: ""
    required: false
  install-command:
    description: Frozen Bun dependency installation command
    default: bun install --frozen-lockfile
    required: false
  reconcile:
    description: Destroy previews whose pull request is no longer open, ignoring the close event
    default: false
    required: false
runs:
  using: composite
  steps:
    - name: Set up Bun for policy resolution
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        CLOUDFLARE_ACCOUNT_ID: ""
        CLOUDFLARE_API_TOKEN: ""
        GITHUB_TOKEN: ""

    - name: Install trusted action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        CLOUDFLARE_ACCOUNT_ID: ""
        CLOUDFLARE_API_TOKEN: ""
        GITHUB_TOKEN: ""
      run: bun install --frozen-lockfile --ignore-scripts

    - id: resolve
      name: Resolve and gate deployment target
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        DEPLOYMENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number) }}
        ALLOW_FORK_COMMITS: ${{ inputs.allow-fork-commits }}
        PULL_REQUEST_REPOSITORY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].head.repo.full_name || github.event.pull_request.head.repo.full_name }}
        PULL_REQUEST_HEAD_REPOSITORY_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].head.repo.id || github.event.pull_request.head.repo.id }}
        PULL_REQUEST_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].head.sha || github.event.pull_request.head.sha }}
        PRODUCTION_BRANCH: ${{ inputs.production-branch }}
        PRODUCTION_STAGE: ${{ inputs.production-stage }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_ID: ${{ github.repository_id }}
        WORKFLOW_RUN_ID: ${{ github.event.workflow_run.workflow_id }}
        WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
        WORKER_NAME: ${{ inputs.worker-name }}
      run: bun "$GITHUB_ACTION_PATH/src/actions/deployment-policy-main.ts"

    - name: Check out exact trusted production commit
      if: steps.resolve.outputs.deploy == 'true' && steps.resolve.outputs.preview != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.resolve.outputs.deployment-sha }}
        persist-credentials: false

    - name: Download artifact from the exact successful CI run
      if: steps.resolve.outputs.deploy == 'true' && steps.resolve.outputs.preview == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.preview-artifact }}
        path: ${{ runner.temp }}/alchemy-preview
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ env.GITHUB_TOKEN }}

    - name: Check out trusted default branch for cleanup
      if: steps.resolve.outputs.cleanup == 'true' || inputs.reconcile == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false

    - name: Set up Bun for artifact-only preview
      if: steps.resolve.outputs.deploy == 'true' && steps.resolve.outputs.preview == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        CLOUDFLARE_ACCOUNT_ID: ""
        CLOUDFLARE_API_TOKEN: ""
        GITHUB_TOKEN: ""

    - name: Set up Bun from checked-out package
      if: (steps.resolve.outputs.deploy == 'true' && steps.resolve.outputs.preview != 'true') || steps.resolve.outputs.cleanup == 'true' || inputs.reconcile == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        CLOUDFLARE_ACCOUNT_ID: ""
        CLOUDFLARE_API_TOKEN: ""
        GITHUB_TOKEN: ""

    - name: Install dependencies
      if: (steps.resolve.outputs.deploy == 'true' && steps.resolve.outputs.preview != 'true') || steps.resolve.outputs.cleanup == 'true' || inputs.reconcile == 'true'
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        CLOUDFLARE_ACCOUNT_ID: ""
        CLOUDFLARE_API_TOKEN: ""
        GITHUB_TOKEN: ""
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: bash -euo pipefail -c "$INSTALL_COMMAND"

    - name: Require Cloudflare credentials
      if: steps.resolve.outputs.deploy == 'true' || steps.resolve.outputs.cleanup == 'true' || inputs.reconcile == 'true'
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo '::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required.'
          exit 1
        fi

    - name: Run typed deployment orchestration
      if: success() && (steps.resolve.outputs.deploy == 'true' || steps.resolve.outputs.cleanup == 'true')
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        ALCHEMY_WORKER_CONFIG: ${{ inputs.worker-config }}
        ALCHEMY_WORKER_SECRETS: ${{ inputs.worker-secrets }}
        ALCHEMY_WORKER_DO_BINDINGS: ${{ inputs.worker-do-bindings }}
        ALCHEMY_WORKER_RATE_LIMIT_BINDINGS: ${{ inputs.worker-rate-limit-bindings }}
        ALCHEMY_WORKER_STATE_BINDINGS: ${{ inputs.worker-state-bindings }}
        ALLOW_FORK_COMMITS: ${{ inputs.allow-fork-commits }}
        ALCHEMY_PREVIEW_ARTIFACT: ${{ runner.temp }}/alchemy-preview
        ALCHEMY_PREVIEW_ASSETS_DIRECTORY: ${{ inputs.preview-assets-directory }}
        ALCHEMY_PREVIEW_ASSETS_CONFIG: ${{ inputs.preview-assets-config }}
        ALCHEMY_PREVIEW_ENTRYPOINT: ${{ inputs.preview-entrypoint }}
        ALCHEMY_PREVIEW_COMPATIBILITY_DATE: ${{ inputs.preview-compatibility-date }}
        ALCHEMY_PREVIEW_COMPATIBILITY_FLAGS: ${{ inputs.preview-compatibility-flags }}
        ALCHEMY_ACTION_PATH: ${{ github.action_path }}
        ALCHEMY_PREVIEW_STATE_URL: ${{ inputs.preview-state-url }}
        ALCHEMY_PREVIEW_STATE_EXPECTED_ORIGIN: ${{ inputs.preview-state-expected-origin }}
        ALCHEMY_PREVIEW_STATE_TOKEN: ${{ inputs.preview-state-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        DEPLOYMENT_SHA: ${{ steps.resolve.outputs.deploy == 'true' && steps.resolve.outputs.deployment-sha || github.event.pull_request.head.sha }}
        DEPLOY_COMMAND: ${{ inputs.deploy-command }}
        DESTROY_COMMAND: ${{ inputs.destroy-command }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        LOG_PATH: ${{ runner.temp }}/alchemy-${{ steps.resolve.outputs.deploy == 'true' && 'deploy' || 'destroy' }}.log
        PHASE: ${{ steps.resolve.outputs.deploy == 'true' && 'deploy' || 'cleanup' }}
        PREVIEW_PATTERN: ${{ inputs.preview-url-pattern }}
        PRODUCTION_BRANCH: ${{ inputs.production-branch }}
        PRODUCTION_STAGE: ${{ inputs.production-stage }}
        PRODUCTION_URL: ${{ inputs.production-url }}
        PULL_REQUEST_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
        PULL_REQUEST_NUMBER: ${{ steps.resolve.outputs.pull-request-number }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_ID: ${{ github.repository_id }}
        STAGE: ${{ steps.resolve.outputs.stage }}
        USE_ADOPT: ${{ inputs.use-adopt }}
        WORKER_NAME: ${{ inputs.worker-name }}
        WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: bun "$GITHUB_ACTION_PATH/src/actions/deployment-orchestration-main.ts"

    - name: Run scheduled preview reconcile
      if: success() && inputs.reconcile == 'true'
      shell: bash
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ""
        OP_CONNECT_TOKEN: ""
        GH_TOKEN: ""
        ALCHEMY_WORKER_CONFIG: ${{ inputs.worker-config }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        DESTROY_COMMAND: ${{ inputs.destroy-command }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        ALCHEMY_ACTION_PATH: ${{ github.action_path }}
        ALCHEMY_PREVIEW_STATE_URL: ${{ inputs.preview-state-url }}
        ALCHEMY_PREVIEW_STATE_EXPECTED_ORIGIN: ${{ inputs.preview-state-expected-origin }}
        ALCHEMY_PREVIEW_STATE_TOKEN: ${{ inputs.preview-state-token }}
        ALCHEMY_PREVIEW_COMPATIBILITY_DATE: ${{ inputs.preview-compatibility-date }}
        ALCHEMY_PREVIEW_COMPATIBILITY_FLAGS: ${{ inputs.preview-compatibility-flags }}
        PHASE: cleanup
        PRODUCTION_STAGE: ${{ inputs.production-stage }}
        REPOSITORY_ID: ${{ github.repository_id }}
        RUNNER_TEMP: ${{ runner.temp }}
        WORKER_NAME: ${{ inputs.worker-name }}
      run: bun "$GITHUB_ACTION_PATH/src/actions/deployment-reconcile-main.ts"

branding:
  icon: upload-cloud
  color: green
