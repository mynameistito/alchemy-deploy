name: Reusable Alchemy deploy

on:
  workflow_call:
    inputs:
      worker-name: { required: true, type: string }
      deploy-command: { required: true, type: string }
      destroy-command: { required: true, type: string }
      production-url: { required: true, type: string }
      production-stage: { default: prod, required: false, type: string }
      use-adopt: { default: false, required: false, type: boolean }
      worker-config: { default: "", required: false, type: string }
      preview-url-pattern:
        {
          default: "https://{worker}-{stage}.*.workers.dev",
          required: false,
          type: string,
        }
      ci-workflow: { default: ci.yml, required: false, type: string }
      production-branch: { default: main, required: false, type: string }
      install-command:
        {
          default: bun install --frozen-lockfile,
          required: false,
          type: string,
        }
    secrets:
      CLOUDFLARE_API_TOKEN: { required: true }
      CLOUDFLARE_ACCOUNT_ID: { required: true }

permissions: {}

concurrency:
  group: >-
    alchemy-deploy-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) ||
      github.event.workflow_run.event == 'push' && 'prod' || 'invalid'
    }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Alchemy stack
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == inputs.production-branch))) || (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      # Read workflow results and contents, create deployments, and update PR reports.
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Run Alchemy deployment policy
        # Pin the published action release immutably.
        uses: mynameistito/alchemy-deploy@eb0bfa48c6f692119db4eefde9e8b093541767c7 # v2.3.1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          worker-name: ${{ inputs.worker-name }}
          deploy-command: ${{ inputs.deploy-command }}
          destroy-command: ${{ inputs.destroy-command }}
          production-url: ${{ inputs.production-url }}
          production-stage: ${{ inputs.production-stage }}
          use-adopt: ${{ inputs.use-adopt }}
          worker-config: ${{ inputs.worker-config }}
          preview-url-pattern: ${{ inputs.preview-url-pattern }}
          ci-workflow: ${{ inputs.ci-workflow }}
          production-branch: ${{ inputs.production-branch }}
          install-command: ${{ inputs.install-command }}
