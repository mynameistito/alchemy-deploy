name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request:
    types: [closed]

jobs:
  deploy:
    # REQUIRED: replace this placeholder with the full 40-character SHA of a published release.
    uses: mynameistito/alchemy-deploy/.github/workflows/deploy.yml@REPLACE_WITH_FULL_40_CHARACTER_RELEASE_SHA
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    with:
      worker-name: replace-me
      deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
      destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
      production-stage: prod
      production-url: https://replace-me.example.com
      use-adopt: false
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
